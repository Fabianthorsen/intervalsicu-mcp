app = "intervalsicu-mcp"
primary_region = "ams"

[build]

[env]
  MCP_TRANSPORT = "http"
  PORT = "8000"
  FASTMCP_HOME = "/fastmcp_data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "fastmcp_data"
  destination = "/fastmcp_data"
