name: Deploy to Fly.io

# Forks get this workflow too. It stays inert until the fork owner runs
# scripts/deploy_fly.{sh,py} and lets it set FLY_API_TOKEN, so an unconfigured
# fork never shows a red X for a deploy it never asked for.

on:
  push:
    branches:
      - main
  # Fork syncs done through the GitHub web button do not always raise a push
  # event, so leave a manual trigger for that case.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both values are per-fork, so they live in this repository's own settings
      # rather than in a tracked file. secrets are unavailable in a job-level
      # `if`, so gate on an output instead.
      - name: Check for Fly configuration
        id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "No FLY_API_TOKEN repository secret — skipping deploy."
            echo "Run scripts/deploy_fly.sh (or deploy_fly.py) to set one up."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Having the token but not the name is a half-finished setup, not an
          # opt-out, so say so loudly instead of skipping.
          if [ -z "$FLY_APP" ]; then
            echo "::error::FLY_API_TOKEN is set but the FLY_APP repository variable is not."
            echo "::error::fly.toml is generated from fly.toml.template, so there is no app"
            echo "::error::name to fall back on. Set it under Settings -> Secrets and"
            echo "::error::variables -> Actions -> Variables, or re-run scripts/deploy_fly.sh."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.configured == 'true'

      # fly.toml is gitignored, so the checkout does not have one. Render it the
      # same way the deploy script does locally.
      - name: Render fly.toml
        if: steps.check.outputs.configured == 'true'
        env:
          FLY_APP: ${{ vars.FLY_APP }}
        run: |
          sed "s|^app *= *\".*\"|app = \"$FLY_APP\"|" fly.toml.template > fly.toml
          echo "Deploying to $FLY_APP"

      - name: Deploy
        if: steps.check.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
        run: flyctl deploy --remote-only --app "$FLY_APP"
